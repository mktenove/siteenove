<!doctype html>
<!-- @dsCard group="Colors" name="Core colors" subtitle="Yellow · Graphite · Ink · Paper — the two-colour identity" viewport="700x180" -->
<html lang="pt-BR"><head>
<meta charset="utf-8"><meta name="viewport" content="width=700">
<title>Colors — Core</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; background: var(--bg-1); padding: 20px; }
  .row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
  .sw { border-radius: 14px; overflow: hidden; border: 1px solid var(--border-1); }
  .chip { height: 96px; }
  .meta { padding: 10px 12px; background: #fff; }
  .name { font-weight: 700; font-size: 13px; }
  .hex { font-family: var(--font-mono); font-size: 11px; color: var(--fg-3); letter-spacing: .02em; margin-top: 2px; }
</style>
</head><body>
<div class="row">
  <div class="sw"><div class="chip" style="background:#FFFF00"></div><div class="meta"><div class="name">Enove Yellow</div><div class="hex">#FFFF00</div></div></div>
  <div class="sw"><div class="chip" style="background:#373435"></div><div class="meta"><div class="name">Graphite</div><div class="hex">#373435</div></div></div>
  <div class="sw"><div class="chip" style="background:#0C0B0B"></div><div class="meta"><div class="name">Ink</div><div class="hex">#0C0B0B</div></div></div>
  <div class="sw"><div class="chip" style="background:#FAFAF8;border-right:1px solid var(--border-1)"></div><div class="meta"><div class="name">Paper</div><div class="hex">#FAFAF8</div></div></div>
</div>
</body></html>
