<!doctype html>
<!-- @dsCard group="Spacing" name="Shadows" subtitle="xs · sm · md · signature yellow glow for CTAs" viewport="700x200" -->
<html lang="pt-BR"><head>
<meta charset="utf-8"><meta name="viewport" content="width=700">
<title>Shadows</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; background: var(--bg-1); padding: 30px 22px; font-family: var(--font-sans); }
  .row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 18px; align-items:end; }
  .box { width: 100%; height: 86px; background: #fff; border-radius: 14px; border: 1px solid var(--border-1); }
  .name { font-weight: 700; font-size: 11px; color: var(--fg-1); letter-spacing:.1em; text-transform: uppercase; margin-top: 10px; }
  .desc { font-size: 10px; color: var(--fg-3); margin-top: 2px; }
</style>
</head><body>
<div class="row">
  <div><div class="box" style="box-shadow: 0 1px 2px rgba(15,13,14,.05)"></div><div class="name">xs</div><div class="desc">Tags, chips</div></div>
  <div><div class="box" style="box-shadow: 0 2px 6px rgba(15,13,14,.06), 0 1px 2px rgba(15,13,14,.04)"></div><div class="name">sm</div><div class="desc">Cards, inputs</div></div>
  <div><div class="box" style="box-shadow: 0 10px 24px -8px rgba(15,13,14,.14), 0 2px 6px rgba(15,13,14,.06)"></div><div class="name">md</div><div class="desc">Menus, floating</div></div>
  <div><div class="box" style="box-shadow: 0 12px 28px -10px rgba(255,230,0,.55); background: var(--enove-yellow);"></div><div class="name">yellow</div><div class="desc">CTA signature</div></div>
</div>
</body></html>
