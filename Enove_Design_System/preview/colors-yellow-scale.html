<!doctype html>
<!-- @dsCard group="Colors" name="Yellow scale" subtitle="Soft → default → dim (hover) → hot (press)" viewport="700x170" -->
<html lang="pt-BR"><head>
<meta charset="utf-8"><meta name="viewport" content="width=700">
<title>Colors — Yellow scale</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; background: var(--bg-1); padding: 20px; }
  .stack { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
  .sw { border-radius: 12px; overflow: hidden; border: 1px solid var(--border-1); }
  .chip { height: 84px; display: flex; align-items: flex-end; padding: 10px; }
  .label { font-weight: 700; font-size: 12px; color: var(--enove-ink); }
  .meta { padding: 8px 10px; background: #fff; }
  .role { font-size: 11px; color: var(--fg-3); }
  .hex { font-family: var(--font-mono); font-size: 11px; color: var(--fg-2); }
</style>
</head><body>
<div class="stack">
  <div class="sw"><div class="chip" style="background:#FFFCA8"><span class="label">soft</span></div><div class="meta"><div class="role">Soft fill / callout</div><div class="hex">#FFFCA8</div></div></div>
  <div class="sw"><div class="chip" style="background:#FFFF00"><span class="label">yellow</span></div><div class="meta"><div class="role">Primary accent</div><div class="hex">#FFFF00</div></div></div>
  <div class="sw"><div class="chip" style="background:#F5ED00"><span class="label">dim</span></div><div class="meta"><div class="role">Hover</div><div class="hex">#F5ED00</div></div></div>
  <div class="sw"><div class="chip" style="background:#FFEA00"><span class="label">hot</span></div><div class="meta"><div class="role">Press / active</div><div class="hex">#FFEA00</div></div></div>
</div>
</body></html>
