<!doctype html>
<!-- @dsCard group="Type" name="Type families" subtitle="Cocogoose Pro · Letterpress · Poppins · Bungee" viewport="700x320" -->
<html lang="pt-BR"><head>
<meta charset="utf-8"><meta name="viewport" content="width=700">
<title>Type — Families</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; background: var(--bg-1); padding: 20px 24px; color: var(--fg-1); }
  .row { display: grid; grid-template-columns: 120px 1fr; gap: 16px; align-items: baseline; padding: 10px 0; border-bottom: 1px solid var(--border-1); }
  .row:last-child { border: 0; }
  .tag { font-family: var(--font-body); font-size: 10px; letter-spacing: .14em; text-transform: uppercase; font-weight: 700; color: var(--fg-3); }
  .sample { font-size: 28px; letter-spacing: -.01em; }
  .cg { font-family: var(--font-display); font-weight: 800; }
  .cg-l { font-family: var(--font-display); font-weight: 400; }
  .cg-letter { font-family: var(--font-letterpress); font-weight: 400; color: #000; }
  .po { font-family: var(--font-body); font-weight: 500; font-size: 22px; }
  .bu { font-family: var(--font-signage); font-weight: 400; font-size: 22px; color: var(--enove-black); background: var(--enove-yellow); padding: 2px 10px; }
</style>
</head><body>
  <div class="row"><div class="tag">Cocogoose Pro · Bold</div><div class="sample cg">enove imobiliária</div></div>
  <div class="row"><div class="tag">Cocogoose · Regular</div><div class="sample cg-l">conectar pessoas a sonhos</div></div>
  <div class="row"><div class="tag">Cocogoose · Letterpress</div><div class="sample cg-letter">jeito Enove de ser</div></div>
  <div class="row"><div class="tag">Poppins · Medium</div><div class="sample po">Corpo · UI · cards · detalhes</div></div>
  <div class="row"><div class="tag">Bungee · Signage</div><div class="sample bu">VENDE-SE</div></div>
</body></html>
