<!doctype html>
<!-- @dsCard group="Spacing" name="Spacing scale" subtitle="8-px base with 4-px half-step — sp-1 to sp-9" viewport="700x320" -->
<html lang="pt-BR"><head>
<meta charset="utf-8"><meta name="viewport" content="width=700">
<title>Spacing</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; background: var(--bg-1); padding: 22px 24px; font-family: var(--font-sans); }
  .row { display: flex; align-items: center; gap: 14px; padding: 6px 0; }
  .tag { width: 46px; font-size: 11px; font-weight: 700; color: var(--fg-2); }
  .px { width: 56px; font-family: var(--font-mono); font-size: 11px; color: var(--fg-3); }
  .bar { height: 14px; background: var(--enove-yellow); border-radius: 2px; }
</style>
</head><body>
  <div class="row"><div class="tag">sp-1</div><div class="px">4 px</div><div class="bar" style="width:4px"></div></div>
  <div class="row"><div class="tag">sp-2</div><div class="px">8 px</div><div class="bar" style="width:8px"></div></div>
  <div class="row"><div class="tag">sp-3</div><div class="px">12 px</div><div class="bar" style="width:12px"></div></div>
  <div class="row"><div class="tag">sp-4</div><div class="px">16 px</div><div class="bar" style="width:16px"></div></div>
  <div class="row"><div class="tag">sp-5</div><div class="px">24 px</div><div class="bar" style="width:24px"></div></div>
  <div class="row"><div class="tag">sp-6</div><div class="px">32 px</div><div class="bar" style="width:32px"></div></div>
  <div class="row"><div class="tag">sp-7</div><div class="px">48 px</div><div class="bar" style="width:48px"></div></div>
  <div class="row"><div class="tag">sp-8</div><div class="px">64 px</div><div class="bar" style="width:64px"></div></div>
  <div class="row"><div class="tag">sp-9</div><div class="px">96 px</div><div class="bar" style="width:96px"></div></div>
</body></html>
