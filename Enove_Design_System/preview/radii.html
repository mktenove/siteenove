<!doctype html>
<!-- @dsCard group="Spacing" name="Radii" subtitle="xs 4 → sm 8 → md 14 → lg 22 → xl 32 → pill" viewport="700x200" -->
<html lang="pt-BR"><head>
<meta charset="utf-8"><meta name="viewport" content="width=700">
<title>Radii</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; background: var(--bg-1); padding: 22px; font-family: var(--font-sans); }
  .row { display: grid; grid-template-columns: repeat(6, 1fr); gap: 14px; align-items:end; }
  .box { width: 100%; aspect-ratio: 1; background: var(--enove-graphite); }
  .meta { margin-top: 8px; font-size: 11px; color: var(--fg-3); font-family: var(--font-mono); }
  .name { font-weight: 700; font-size: 11px; color: var(--fg-1); letter-spacing:.1em; text-transform: uppercase; }
</style>
</head><body>
<div class="row">
  <div><div class="box" style="border-radius:4px"></div><div class="name">xs</div><div class="meta">4 px</div></div>
  <div><div class="box" style="border-radius:8px"></div><div class="name">sm</div><div class="meta">8 px</div></div>
  <div><div class="box" style="border-radius:14px"></div><div class="name">md</div><div class="meta">14 px</div></div>
  <div><div class="box" style="border-radius:22px"></div><div class="name">lg</div><div class="meta">22 px</div></div>
  <div><div class="box" style="border-radius:32px"></div><div class="name">xl</div><div class="meta">32 px</div></div>
  <div><div class="box" style="border-radius:999px"></div><div class="name">pill</div><div class="meta">999</div></div>
</div>
</body></html>
