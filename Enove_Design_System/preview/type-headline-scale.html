<!doctype html>
<!-- @dsCard group="Type" name="Headline scale" subtitle="H1–H4 · UPPER or lower, never Title Case" viewport="700x260" -->
<html lang="pt-BR"><head>
<meta charset="utf-8"><meta name="viewport" content="width=700">
<title>Type — Headline scale</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; background: var(--bg-1); padding: 20px 24px; color: var(--fg-1); }
  .row { display: grid; grid-template-columns: 90px 1fr; gap: 14px; align-items: baseline; padding: 7px 0; border-bottom: 1px solid var(--border-1); }
  .row:last-child { border: 0; }
  .tag { font-family: var(--font-body); font-size: 10px; letter-spacing: .14em; text-transform: uppercase; font-weight: 700; color: var(--fg-3); }
  .h1 { font-family: var(--font-display); font-size: 36px; font-weight: 800; letter-spacing: -.02em; line-height: 1.08; text-transform: uppercase; }
  .h2 { font-family: var(--font-display); font-size: 28px; font-weight: 800; letter-spacing: -.01em; }
  .h3 { font-family: var(--font-body); font-size: 20px; font-weight: 700; }
  .h4 { font-family: var(--font-body); font-size: 14px; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; }
</style>
</head><body>
  <div class="row"><div class="tag">H1 · 36</div><div class="h1">FAZEMOS A COISA CERTA SEMPRE.</div></div>
  <div class="row"><div class="tag">H2 · 28</div><div class="h2">O jeito Enove de ser</div></div>
  <div class="row"><div class="tag">H3 · 20</div><div class="h3">Missão, visão, valores</div></div>
  <div class="row"><div class="tag">H4 · 14</div><div class="h4">Plantão de vendas</div></div>
</body></html>
