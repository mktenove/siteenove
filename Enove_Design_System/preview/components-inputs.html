<!doctype html>
<!-- @dsCard group="Components" name="Inputs & search" subtitle="Text field · phone · pill search" viewport="700x260" -->
<html lang="pt-BR"><head>
<meta charset="utf-8"><meta name="viewport" content="width=700">
<title>Components — Inputs</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; background: var(--bg-1); padding: 22px 24px; font-family: var(--font-sans); }
  .field { display:flex; flex-direction:column; gap: 6px; margin-bottom: 14px; }
  .label { font-size: 11px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--fg-3); }
  .input { font-family: inherit; font-size: 15px; padding: 12px 14px; border-radius: 14px; border: 1.5px solid var(--border-1); background: #fff; color: var(--fg-1); outline: none; }
  .input:focus { border-color: var(--enove-graphite); box-shadow: 0 0 0 4px rgba(255,255,0,.4); }
  .pill-search { display:flex; align-items:center; gap:10px; border: 1.5px solid var(--border-1); padding: 6px 6px 6px 16px; border-radius: 999px; background:#fff; }
  .pill-search input { flex:1; border:0; outline:none; font-size:14px; font-family:inherit; }
  .pill-btn { background: var(--enove-ink); color:#fff; border-radius: 999px; padding: 10px 18px; font-weight:700; font-size:13px; border:0; cursor:pointer; }
</style>
</head><body>
  <div class="field">
    <span class="label">Seu e-mail</span>
    <input class="input" placeholder="voce@exemplo.com">
  </div>
  <div class="field">
    <span class="label">Telefone</span>
    <input class="input" value="(51) 99000-0000">
  </div>
  <div class="pill-search">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    <input placeholder="Bairro, cidade ou código do imóvel">
    <button class="pill-btn">Buscar</button>
  </div>
</body></html>
