<!doctype html>
<!-- @dsCard group="Colors" name="Graphite scale" subtitle="Neutrals 900–100, centered on brand 500 (#373435)" viewport="700x160" -->
<html lang="pt-BR"><head>
<meta charset="utf-8"><meta name="viewport" content="width=700">
<title>Colors — Grayscale (per manual)</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; background: var(--bg-1); padding: 20px; font-family: var(--font-body); }
  .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
  .sw { border-radius: 12px; overflow: hidden; border: 1px solid var(--border-1); background: #fff; }
  .chip { height: 96px; position: relative; }
  .chip .on { position:absolute; left: 12px; bottom: 10px; font-family: var(--font-display); font-weight: 800; font-size: 14px; letter-spacing: -.01em; text-transform: lowercase; }
  .meta { padding: 9px 12px; }
  .name { font-weight: 700; font-size: 12px; color: var(--enove-black); }
  .hex { font-family: var(--font-mono); font-size: 10px; color: var(--fg-3); margin-top: 2px; }
  .role { font-size: 10px; color: var(--fg-3); margin-top: 2px; letter-spacing: .08em; text-transform: uppercase; font-weight: 700; }
</style>
</head><body>
<div class="grid">
  <div class="sw"><div class="chip" style="background:#000000"><span class="on" style="color:#FFFF00">enove</span></div>
    <div class="meta"><div class="name">Preto Puro</div><div class="hex">#000000 · Pantone Black C</div><div class="role">Primary ground</div></div></div>
  <div class="sw"><div class="chip" style="background:#373435"><span class="on" style="color:#FFFF00">enove</span></div>
    <div class="meta"><div class="name">Grafite</div><div class="hex">#373435 · rgb 55,52,53</div><div class="role">Secondary dark</div></div></div>
  <div class="sw"><div class="chip" style="background:#8C8A8B"><span class="on" style="color:#000">enove</span></div>
    <div class="meta"><div class="name">Cinza Médio</div><div class="hex">#8C8A8B · rgb 140,138,139</div><div class="role">Muted / meta</div></div></div>
  <div class="sw"><div class="chip" style="background:#D4D3D3"><span class="on" style="color:#000">enove</span></div>
    <div class="meta"><div class="name">Cinza Claro</div><div class="hex">#D4D3D3 · rgb 212,211,211</div><div class="role">Borders / surfaces</div></div></div>
</div>
</body></html>
