<!doctype html>
<!-- @dsCard group="Type" name="Display type" subtitle="Montserrat Black · lowercase · tight tracking" viewport="700x220" -->
<html lang="pt-BR"><head>
<meta charset="utf-8"><meta name="viewport" content="width=700">
<title>Type — Display</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; background: var(--bg-1); padding: 28px 24px; }
  .display { font-family: var(--font-display); font-weight: 800; line-height: .95; letter-spacing: -.025em; text-transform: lowercase; color: var(--fg-1); }
  .d1 { font-size: 84px; }
  .d2 { font-size: 56px; margin-top: -4px; }
  .meta { display:flex; gap: 18px; margin-top: 14px; font-size: 11px; color: var(--fg-3); letter-spacing:.12em; text-transform:uppercase; font-weight:700; font-family: var(--font-body); }
  em { font-style: italic; font-weight: 400; color: var(--fg-2); }
</style>
</head><body>
  <div class="display d1">conectar</div>
  <div class="display d2">pessoas a <em>sonhos</em>.</div>
  <div class="meta">
    <span>Cocogoose Pro Bold 800</span>
    <span>84 / 56 px</span>
    <span>tracking −0.025em</span>
    <span>lowercase</span>
  </div>
</body></html>
