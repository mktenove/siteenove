<!doctype html>
<!-- @dsCard group="UI Kit — Enove Imobiliaria" name="Enove Imobiliária — UI kit" subtitle="Home: hero · search · listings · culture band · footer" viewport="1280x1400" -->
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Enove Imobiliária — UI Kit</title>
<meta name="viewport" content="width=1280">
<link rel="stylesheet" href="../../colors_and_type.css">
<style>
  body { margin: 0; background: #fff; }
  .hero { background: #000; color: #fff; padding: 80px 64px 96px; position: relative; overflow: hidden; }
  .hero::before { content:""; position:absolute; inset: -40px -40px auto auto; width: 520px; height: 520px; background: radial-gradient(circle, rgba(255,255,0,.18), transparent 60%); }
  .hero h1 { font-family: var(--font-display); font-weight: 800; font-size: 88px; line-height: .95; letter-spacing: -.03em; text-transform: lowercase; margin: 0; max-width: 880px; }
  .hero h1 em { color: var(--enove-yellow); font-style: italic; font-weight: 800; }
  .hero .sub { max-width: 560px; font-size: 18px; color: rgba(255,255,255,.75); margin-top: 28px; line-height: 1.55; }
  .searchwrap { margin-top: 40px; }

  .grid-section { padding: 80px 64px; }
  .eyebrow { font-family: var(--font-display); font-size: 12px; letter-spacing: .2em; text-transform: uppercase; font-weight: 800; color: var(--fg-3); }
  .section-head { display:flex; justify-content: space-between; align-items: baseline; margin-bottom: 36px; gap: 24px; }
  .section-head h2 { font-family: var(--font-display); font-weight: 800; font-size: 44px; letter-spacing: -.02em; margin: 6px 0 0; text-transform: lowercase; }
  .cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 28px; }

  .band { background: var(--enove-yellow); color: var(--enove-black); padding: 64px; display: grid; grid-template-columns: 1.4fr 1fr; gap: 48px; align-items: center; }
  .band h3 { font-family: var(--font-display); font-weight: 800; font-size: 48px; letter-spacing: -.02em; line-height: 1; margin: 0 0 16px; text-transform: lowercase; }
  .band p { font-size: 17px; line-height: 1.55; margin: 0 0 24px; max-width: 440px; }
  .band .stat { font-family: var(--font-display); font-size: 96px; font-weight: 800; letter-spacing: -.04em; line-height: 1; }
  .band .stat-label { font-weight: 700; font-size: 14px; text-transform: uppercase; letter-spacing: .08em; margin-top: 6px; }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel" src="components.jsx"></script>

<script type="text/babel">
const listings = [
  { id:1, price:'R$ 1.240.000', address:'Av. Getúlio Vargas, 1480', district:'Menino Deus · Porto Alegre', bedrooms:3, baths:2, area:112, parking:2, tag:'Destaque', img:'linear-gradient(135deg,#3a3738,#1a1718)'},
  { id:2, price:'R$ 2.890.000', address:'Rua Mostardeiro, 322', district:'Moinhos de Vento · Porto Alegre', bedrooms:4, baths:3, area:186, parking:3, tag:'Pronto p/ morar', img:'linear-gradient(135deg,#4a4648,#2b2829)'},
  { id:3, price:'R$ 780.000', address:'Rua Dom Pedro II, 812', district:'Higienópolis · Porto Alegre', bedrooms:2, baths:1, area:74, parking:1, tag:null, img:'linear-gradient(135deg,#505050,#2a2a2a)'},
  { id:4, price:'R$ 1.680.000', address:'Rua Felipe de Oliveira, 55', district:'Petrópolis · Porto Alegre', bedrooms:3, baths:2, area:124, parking:2, tag:'Destaque', img:'linear-gradient(135deg,#3d3a3b,#1f1d1e)'},
  { id:5, price:'R$ 4.450.000', address:'Rua Dinarte Ribeiro, 240', district:'Moinhos de Vento · Porto Alegre', bedrooms:4, baths:4, area:245, parking:4, tag:'Pronto p/ morar', img:'linear-gradient(135deg,#4f4a4b,#2d2a2b)'},
  { id:6, price:'R$ 920.000', address:'Av. Wenceslau Escobar, 1102', district:'Tristeza · Porto Alegre', bedrooms:3, baths:2, area:95, parking:2, tag:null, img:'linear-gradient(135deg,#4a4748,#282627)'},
];

const App = () => {
  const [favs, setFavs] = React.useState(new Set([2]));
  const toggleFav = id => { const n = new Set(favs); n.has(id) ? n.delete(id) : n.add(id); setFavs(n); };

  return (
    <>
      <Header />
      <section className="hero">
        <span className="eyebrow" style={{color:'var(--enove-yellow)'}}>Enove Imobiliária · Porto Alegre</span>
        <h1 style={{marginTop:14}}>conectar pessoas<br/>a <em>sonhos</em>.</h1>
        <p className="sub">Mais de 1.200 imóveis prontos para morar e um time de corretores que trata seu sonho como se fosse o dele.</p>
        <div className="searchwrap"><SearchBar onSearch={()=>{}} /></div>
      </section>

      <section className="grid-section">
        <div className="section-head">
          <div>
            <span className="eyebrow">Destaques do mês</span>
            <h2>imóveis em destaque</h2>
          </div>
          <Button variant="ghost" icon="arrow">Ver todos</Button>
        </div>
        <div className="cards">
          {listings.slice(0,6).map(l => (
            <PropertyCard key={l.id} {...l} fav={favs.has(l.id)} onFav={()=>toggleFav(l.id)} />
          ))}
        </div>
      </section>

      <section className="band">
        <div>
          <span className="eyebrow" style={{color:'rgba(0,0,0,.65)'}}>Cultura · Performance</span>
          <h3>fazemos a coisa<br/>certa sempre.</h3>
          <p>Integridade, comprometimento, inovação, positividade e segurança. Cinco valores que definem o jeito Enove de ser — e que você sente em cada negociação.</p>
          <Button variant="dark" icon="arrow">Conheça nossa cultura</Button>
        </div>
        <div style={{borderLeft:'2px solid rgba(0,0,0,.15)', paddingLeft:48}}>
          <div className="stat">R$1bi</div>
          <div className="stat-label">Meta de VGV até 2030</div>
          <div style={{display:'grid', gridTemplateColumns:'1fr 1fr', gap:24, marginTop:32}}>
            <div><div style={{fontFamily:'var(--font-display)', fontSize:44, fontWeight:800, letterSpacing:'-.02em'}}>1.2K+</div><div style={{fontSize:13, fontWeight:700, letterSpacing:'.06em', textTransform:'uppercase'}}>Imóveis ativos</div></div>
            <div><div style={{fontFamily:'var(--font-display)', fontSize:44, fontWeight:800, letterSpacing:'-.02em'}}>180+</div><div style={{fontSize:13, fontWeight:700, letterSpacing:'.06em', textTransform:'uppercase'}}>Corretores no time</div></div>
          </div>
        </div>
      </section>

      <Footer />
    </>
  );
};

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
